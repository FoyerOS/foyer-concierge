[workspace]
resolver = "3"
members = ["crates/concierge-api", "crates/concierge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FoyerOS/foyer-concierge"

[workspace.dependencies]
concierge-api = { path = "crates/concierge-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras"] }
